<header class="site-header">
  <div class="container">
    <nav class="navbar">
      <a href="{{ '/' | relative_url }}" class="site-logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">{{ site.title }}</span>
      </a>

      <button class="nav-toggle" aria-label="菜单" id="navToggle">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-menu" id="navMenu">
        {% for item in site.navigation %}
          <li class="nav-item {% if page.url == item.url %}active{% endif %}">
            <a href="{{ item.url | relative_url }}" class="nav-link">{{ item.title }}</a>
          </li>
        {% endfor %}
      </ul>

      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
          🌙
        </button>
        <button class="search-toggle" id="searchToggle" aria-label="搜索">
          🔍
        </button>
      </div>
    </nav>

    <!-- Search Bar -->
    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="搜索 Clash 教程、客户端、FAQ..." autocomplete="off">
      <button class="search-close" id="searchClose">✕</button>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
  <!-- 弹窗 HTML 结构 -->
<div id="popupOverlay">
  <div class="popup-content">
    <div style="display: flex; flex-direction: column; gap: 1rem;">
      <!-- 推荐链接 -->
      <a href="https://ml.yfqz1.net/register?code=PCC6A3bC" target="_blank" class="popup-link">
        <p class="popup-title">Clash 机场推荐</p>
        <img src="https://free.picui.cn/free/2026/06/05/6a229370bf0c1.png" alt="机场地址" class="popup-image">
      </a>
      
      <!-- 分割线 -->
      <div style="border-top: 1px solid #f3f4f6; padding-top: 1rem;">
        <a href="http://shop.xinkonyun.cc/" target="_blank" class="popup-shop-btn">
          🛒 购买 Shadowrocket 独享账号/海外其他账号
        </a>
      </div>
    </div>
    
    <!-- 关闭按钮 -->
    <a href="https://ml.yfqz1.net/register?code=PCC6A3bC" target="_blank" class="popup-link"><button class="popup-close-btn" id="popupCloseBtn" aria-label="关闭">&times;</button></a>
  </div>
</div>

<!-- 弹窗控制脚本 -->
<script>
  (function() {
    const popupOverlay = document.getElementById('popupOverlay');
    const popupCloseBtn = document.getElementById('popupCloseBtn');
    
    // 页面加载完成后显示弹窗
    window.addEventListener('DOMContentLoaded', function() {
      // 延迟 500ms 显示，效果更自然
      setTimeout(() => {
        popupOverlay.classList.add('show');
      }, 50);
    });
    
    // 关闭按钮点击事件
    popupCloseBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      popupOverlay.classList.remove('show');
    });
    
    // 点击遮罩层不关闭（强制引导），如需点击遮罩关闭可取消下面注释
    /*
    popupOverlay.addEventListener('click', function(e) {
      if (e.target === popupOverlay) {
        popupOverlay.classList.remove('show');
      }
    });
    */
  })();
</script>
<!-- 弹窗样式与脚本结束 -->
</header>
